[project]
name = "luzpreddict"
version = "0.1.0"
description = "Predicción del precio horario de la luz (PVPC) para el día siguiente"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # orden de imports
    "UP",  # sintaxis moderna de Python
    "B",   # errores habituales (bugbear)
    "SIM", # simplificaciones
]

[tool.ruff.lint.isort]
# La carpeta alembic/ (migraciones) no es la librería alembic
known-third-party = ["alembic"]
