server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Para la API: el dominio original y la IP del cliente
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;  # la que usa el límite de peticiones
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rutas de la API: las mismas que el proxy de vite.config.ts
    location /api/           { proxy_pass http://api:8000; }
    location /v1/            { proxy_pass http://api:8000; }
    location /health         { proxy_pass http://api:8000; }
    location /docs           { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # Ficheros con hash en el nombre: se pueden guardar para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Páginas de la web (react-router): todas sirven index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
