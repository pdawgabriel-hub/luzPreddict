name: Lighthouse

# Audita la web publicada tras cada despliegue a producción (Vercel avisa a GitHub al
# terminar) y bajo demanda. No bloquea nada: mira el resultado ya desplegado.
# Móvil emulado, 3 cargas por página (se usa la mediana: el rendimiento varía mucho en
# las máquinas de GitHub). Umbrales en .github/lighthouserc.json: la accesibilidad por
# debajo de 95 hace fallar la ejecución; el resto solo avisa.
on:
  deployment_status:
  workflow_dispatch:

# Si llegan dos despliegues seguidos, basta con auditar el último
concurrency:
  group: lighthouse
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Siempre el dominio estable: las URLs de cada despliegue pueden tener protección de Vercel
  SITE_URL: https://luzpreddict.vercel.app

jobs:
  lighthouse:
    name: Rendimiento y accesibilidad
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Lighthouse
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE_URL }}/
            ${{ env.SITE_URL }}/historico
            ${{ env.SITE_URL }}/modelo
            ${{ env.SITE_URL }}/simulador
          runs: 3
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true # informes HTML como fichero de la ejecución
          temporaryPublicStorage: true # y un enlace público a cada informe (dura unos días)

      - name: Resumen
        if: always() && steps.lhci.outputs.manifest != ''
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
        run: |
          jq -rn --argjson manifest "$MANIFEST" --argjson links "${LINKS:-{\}}" --arg site "$SITE_URL" '
            def score: if . == null then "-" else (. * 100 | round | tostring) end;
            "### Lighthouse: móvil, mediana de 3 cargas\n",
            "| Página | Rendimiento | Accesibilidad | Buenas prácticas | SEO | Informe |",
            "|---|---|---|---|---|---|",
            ($manifest[] | select(.isRepresentativeRun) |
              "| \(.url | ltrimstr($site)) | \(.summary.performance | score) | \(.summary.accessibility | score)" +
              " | \(.summary["best-practices"] | score) | \(.summary.seo | score)" +
              " | \(if $links[.url] then "[ver](\($links[.url]))" else "-" end) |")
          ' >> "$GITHUB_STEP_SUMMARY"
