name: Reentrenamiento semanal

# Domingos a las 3:00 UTC (4:00 o 5:00 en Madrid), lejos de la tarea diaria. La previsión
# usa siempre el modelo más reciente: desde la tarea del domingo ya usa el nuevo.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Los workflows que escriben en la base de datos esperan su turno en lugar de solaparse
concurrency:
  group: neon-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    name: Entrenar y guardar el modelo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pipeline.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-pipeline.txt

      - name: Migraciones (Alembic)
        run: python -m alembic upgrade head

      # Guarda el modelo con sus métricas, borra el binario de los antiguos (conserva los
      # cuatro últimos) y escribe el resumen; avisa si el modelo no mejora a las referencias
      - name: Entrenar
        run: python -m src.pipeline train
