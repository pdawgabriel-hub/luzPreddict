name: CI

on:
  push:
    branches: [main, "fase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se sube otra vez a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint y tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pipeline.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: make lint

      - name: Tests (pytest)
        run: make test
