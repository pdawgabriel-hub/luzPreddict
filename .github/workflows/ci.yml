name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se sube otra vez a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint y tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL para los tests de base de datos (misma versión que en local)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luz
          POSTGRES_PASSWORD: luz
          POSTGRES_DB: luzpreddict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luz -d luzpreddict_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://luz:luz@localhost:5432/luzpreddict_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pipeline.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: make lint

      - name: Tests (pytest)
        run: make test
