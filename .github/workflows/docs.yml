name: Guía técnica

# Construye la guía con MkDocs Material y la publica en GitHub Pages
# (https://pdawgabriel-hub.github.io/luzPreddict/) cuando cambia algo de docs/.
# Requiere, una sola vez: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Construir la guía
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar MkDocs Material
        run: python -m pip install -r requirements-docs.txt

      # --strict: un enlace roto o una página fuera del menú hacen fallar la construcción
      - name: Construir
        run: python -m mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
