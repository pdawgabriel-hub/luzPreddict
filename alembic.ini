# Configuración de Alembic (migraciones de la base de datos).
# La conexión no está aquí: se toma de DATABASE_URL (ver .env.example).
#
#   make migrate                                    # aplica las migraciones pendientes
#   alembic revision --autogenerate -m "mensaje"     # crea una migración a partir de src/db/models.py

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = %(here)s/venv/bin/ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
